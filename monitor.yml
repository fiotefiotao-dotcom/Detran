name: monitor-resende
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
permissions: { actions: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Verificar Resende
        env:
          CPF: ${{ secrets.CPF }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node monitor.mjs; rc=$?
          # 10 = Resende encontrada: aviso enviado, desliga o monitor para não repetir
          if [ $rc -eq 10 ]; then gh workflow disable monitor.yml --repo "$GITHUB_REPOSITORY"; exit 0; fi
          exit $rc
